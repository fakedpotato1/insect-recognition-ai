name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 numpy
          pip install -r ai/requirements.txt
          pip install -r backend/requirements.txt

      - name: Lint Python with flake8
        run: |
          flake8 ai backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ai backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Python unit tests
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("ai/tests", pattern="*tests.py")
          test_count = suite.countTestCases()
          print(f"Discovered {test_count} Python tests")
          if test_count == 0:
              sys.exit(0)

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
